[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gallianzac-timeoutbudget"
version = "0.1.0"
description = "按历史耗时分配各级超时，给出与总预算的平衡方案"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gallianzac" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://gallianzac.github.io"
Repository = "https://github.com/gallianzac/timeoutbudget"
Issues = "https://github.com/gallianzac/timeoutbudget/issues"

[project.scripts]
timeoutbudget = "timeoutbudget:main"

[tool.setuptools]
py-modules = ["timeoutbudget"]
